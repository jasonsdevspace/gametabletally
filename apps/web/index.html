<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <!-- viewport-fit=cover, so a phone gives the page its safe areas rather than zero. -->
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta
            name="description"
            content="A scorekeeper for the game table. Tap in each round and the app applies the game's scoring rules."
        />
        <!-- The browser's bar, on the kit's ground in each theme. The kit's script repoints both at
             the theme a visitor picks. -->
        <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
        <link
            rel="preload"
            href="/fonts/dm-sans-latin.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link rel="manifest" href="/manifest.webmanifest" />
        <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
        <title>Game Table Tally</title>
        <!-- theme-script -->
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
