# Monthly checks for newer versions of everything this repo depends on.
# Once a month, so a month of updates arrives as one pull request per group and is reviewed in
# one sitting, since in a weekly batch each later pull request needed a branch update to merge.
#
# The workflow actions are pinned to commit hashes, which never move on their
# own, so without this they would quietly fall behind. Minor and patch updates
# are grouped into one pull request per ecosystem to keep the noise down, with
# TypeScript and its lint plugin in a group of their own.
# Security fixes arrive separately, as soon as an advisory is published.
# Each update carries the dependencies label alone, so pull requests sort by
# the kind of work rather than by the package manager. A new version waits two
# weeks before it is offered, so a release pulled for being compromised is
# usually gone before it is proposed. Security updates do not wait.
version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: monthly
      cooldown:
          default-days: 14
      labels: ['dependencies']
      groups:
          # TypeScript and its lint plugin move together. typescript-eslint
          # names the TypeScript versions it supports down to the minor, so
          # Dependabot only offers a TypeScript minor once the plugin accepts it.
          typescript:
              patterns: ['typescript', 'typescript-eslint', '@typescript-eslint/*']
              update-types: [minor, patch]
          npm:
              update-types: [minor, patch]
      # A new TypeScript major waits for typescript-eslint to support it,
      # since the lint tooling refuses to install against an unsupported one.
      ignore:
          - dependency-name: typescript
            update-types: ['version-update:semver-major']
          # The Node types follow the Node major in .nvmrc.
          - dependency-name: '@types/node'
            update-types: ['version-update:semver-major']
          # The design kit's version moves by hand, in a pull request of its own that
          # reads the release's Upgrading notes and checks the pages, since a release of
          # the kit can change what a page draws. A security fix for it still arrives on
          # its own, since a rule that names only the package holds back version updates.
          - dependency-name: '@jasonsdevspace/design-kit'

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      cooldown:
          default-days: 14
      labels: ['dependencies']
      groups:
          actions:
              patterns: ['*']
