name: CI

on:
    push:
        branches: [main]
    # Every pull request, not only those into main, so a PR stacked on
    # another's branch is checked before it is merged down.
    pull_request:

permissions:
    contents: read

# A newer push to a pull request supersedes the run in progress. A push to
# main does not: runs on main wait their turn, so the newest commit is always
# the last one checked and deployed, and a run that has handed its site to
# Pages is never canceled, which would leave the deployment pending.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The install below skips its packages' install scripts, so no dependency runs code here by
# being installed.
jobs:
    verify:
        name: Lint, test and build
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Type-check
              run: npm run type-check

            - name: Lint
              run: npm run lint

            - name: Format check
              run: npm run format:check

            - name: Prose check
              run: npm run prose

            - name: Node version check
              run: npm run node-check

            - name: Unit tests
              run: npm run test:run

            # The scoring package from its compiled output, and the app as a
            # browser receives it, so a build that type-checks but does not
            # bundle is caught here.
            - name: Build
              run: npm run build

            # The scoring package as a phone's script runtime would load it: the
            # one built script, evaluated in QuickJS, which has none of Node's
            # globals and none of a browser's, and held to every case the tests
            # run against the source.
            - name: Scoring cases outside Node
              run: npm run cases:outside-node

    # The app in a real browser, on a desktop and a phone profile, from the built files served as
    # GitHub Pages serves them: every address prerendered and read with no script, the not-found
    # page with its 404, an axe audit and a target size check of each page, and the move between
    # screens. Its own job, so it runs beside the checks above rather than after them.
    browser:
        name: Browser tests
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --ignore-scripts

            # The runner image has the libraries Chromium needs, so only the browser is fetched.
            # Chromium is started once here, so a library a later runner image lacks fails this
            # step, not a test.
            - name: Install Chromium
              timeout-minutes: 3
              run: |
                  npx --no-install playwright install chromium
                  node -e "require('@playwright/test').chromium.launch().then((browser) => browser.close())"

            # The script builds the app before it runs the tests.
            - name: Browser tests
              run: npm run e2e

            - name: Upload the report on failure
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: playwright-report
                  path: |
                      apps/web/playwright-report
                      apps/web/test-results
                  retention-days: 7

    # Lighthouse as a phone on a slow network loads each page: a hundred for accessibility,
    # ninety for performance, a largest paint and a layout shift a visit counts as good, and the
    # script and style each page carries held to a budget. Its own job, so it runs beside the
    # browser tests rather than after them.
    lighthouse:
        name: Lighthouse audits
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Install Chromium
              timeout-minutes: 3
              run: |
                  npx --no-install playwright install chromium
                  node -e "require('@playwright/test').chromium.launch().then((browser) => browser.close())"

            # The script builds the app before it audits it.
            - name: Lighthouse audits
              run: npm run lighthouse

    # The app, published to GitHub Pages at gametabletally.com once every check above has passed
    # on main. A merge that fails a check is never deployed. The app is built in a job with no more
    # than read access, so nothing the build installs or runs can deploy, and the deploy job runs
    # only GitHub's own Pages actions.
    site:
        name: Build the site
        needs: [verify, browser, lighthouse]
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        outputs:
            current: ${{ steps.head.outputs.current }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Build
              run: npm run build

            # A run of an older commit, run again after a newer one has deployed, would put the
            # older build back over it, so only the commit at the head of main is deployed. Any
            # other is left out with a notice rather than failed, since a newer run deploys.
            - name: Check the commit is still the head of main
              id: head
              run: |
                  head=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
                  if [ "$head" = "$GITHUB_SHA" ]; then
                      echo "current=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "current=false" >> "$GITHUB_OUTPUT"
                      echo "::notice::$GITHUB_SHA is no longer the head of main, which is $head, so it is not deployed."
                  fi

            - name: Upload the site
              if: steps.head.outputs.current == 'true'
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: apps/web/dist

    deploy:
        name: Deploy the site
        needs: site
        if: needs.site.outputs.current == 'true'
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Configure Pages
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

            - name: Summarize the deploy
              env:
                  PAGE_URL: ${{ steps.deployment.outputs.page_url }}
              run: |
                  commit="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
                  printf '### Deployed\n\n%s, from [`%s`](%s).\n' "$PAGE_URL" "${GITHUB_SHA:0:7}" "$commit" >> "$GITHUB_STEP_SUMMARY"
